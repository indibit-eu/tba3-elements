<div class="d-flex flex-wrap gap-2">
  @for (option of options(); track option.value) {
    <button
      type="button"
      class="btn btn-sm rounded-pill"
      [class.btn-secondary]="isSelected(option.value)"
      [class.btn-outline-secondary]="!isSelected(option.value)"
      [attr.aria-pressed]="isSelected(option.value)"
      (click)="toggle(option.value)"
    >
      @if (option.color) {
        <i class="fa-solid fa-square me-1" [style.color]="option.color" aria-hidden="true"></i>
      }
      {{ option.label }}
    </button>
  }
</div>
