<div class="d-flex flex-column gap-2">
  @if (hasFilter()) {
    <div class="d-flex flex-wrap align-items-center column-gap-3 row-gap-2">
      <div class="tba3-control-label small text-secondary" [id]="filterLabelId">
        {{ filterLabel() }}
      </div>
      <div class="d-flex flex-wrap gap-2">
        <ng-content select="[tba3Filter]" />
      </div>
    </div>
  }
  @if (hasComparisons()) {
    <div class="d-flex flex-wrap align-items-center column-gap-3 row-gap-2">
      <div class="tba3-control-label small text-secondary" [id]="comparisonsLabelId">
        {{ comparisonsLabel() }}
      </div>
      <div class="d-flex flex-wrap gap-2">
        <ng-content select="[tba3Comparisons]" />
      </div>
    </div>
  }
  @if (hasView()) {
    <div class="d-flex flex-wrap align-items-center column-gap-3 row-gap-2">
      <div class="tba3-control-label small text-secondary" [id]="viewLabelId">
        {{ viewLabel() }}
      </div>
      <div class="d-flex flex-wrap gap-2">
        <ng-content select="[tba3View]" />
      </div>
    </div>
  }
</div>
